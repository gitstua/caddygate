name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: cloudflare
            module: github.com/caddy-dns/cloudflare
            primary: true
          - provider: route53
            module: github.com/caddy-dns/route53
            primary: false
          - provider: azure
            module: github.com/caddy-dns/azure
            primary: false

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          PROVIDER="${{ matrix.provider }}"
          REF="${{ github.ref }}"

          # Every provider always gets a latest-<provider> tag
          TAGS="${IMAGE}:latest-${PROVIDER}"

          # On version tags, add versioned tags
          if [[ "${REF}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="${TAGS},${IMAGE}:${VERSION}-${PROVIDER}"
          fi

          # Cloudflare is the default — also gets the unqualified tags
          if [[ "${{ matrix.primary }}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
            if [[ "${REF}" == refs/tags/v* ]]; then
              VERSION="${{ github.ref_name }}"
              TAGS="${TAGS},${IMAGE}:${VERSION}"
            fi
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DNS_MODULE=${{ matrix.module }}
          cache-from: type=gha,scope=${{ matrix.provider }}
          cache-to: type=gha,mode=max,scope=${{ matrix.provider }}
